<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keep-Me</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg">
</head>
<body>

<header>
  <div class="header-left">
    <h1>Keep-Me</h1>
    <span class="tagline">multi-project tracker</span>
  </div>
  <button id="shutdownBtn" class="btn-shutdown" onclick="shutdown()">Shut Down Server</button>
</header>

<div id="app-layout">

  <!-- ── Left: project navigator + detail ─────────────────── -->
  <div id="left-panel">
    <div id="projectNav">
      <select id="projectSelect" onchange="onProjectChange(this.value)"></select>
      <button class="btn-primary" onclick="openNewProject()">+ New</button>
    </div>

    <div id="newProjectPanel" class="panel hidden">
      <h3>New Project</h3>
      <div class="form-row">
        <input id="npName" type="text" placeholder="Project name">
        <input id="npUrl"  type="text" placeholder="https://...  or  file:///home/...">
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="addProject()">Add</button>
        <button class="btn" onclick="closeNewProject()">Cancel</button>
      </div>
    </div>

    <div id="projectDetail"></div>
  </div>

  <!-- ── Right: flashcard gallery ──────────────────────────── -->
  <div id="right-panel">
    <div class="fc-header">
      <span class="fc-title">Flashcards</span>
      <button class="btn fc-show-all-btn" id="fcShowAllBtn" onclick="toggleShowAllCards()">Show All</button>
      <button class="btn-primary" onclick="openAddCard()">+ Card</button>
    </div>

    <div id="addCardPanel" class="panel hidden">
      <h3>New Flashcard</h3>
      <div class="form-row">
        <select id="fcTopic"></select>
      </div>
      <div class="form-row">
        <textarea id="fcFront" placeholder="Front — question / concept" rows="3"></textarea>
      </div>
      <div class="form-row">
        <textarea id="fcBack" placeholder="Back — answer / explanation" rows="3"></textarea>
      </div>
      <div class="form-row fc-interval-row">
        <label class="fc-label" for="fcInterval">Interval (days)</label>
        <input id="fcInterval" type="number" value="7" min="1">
      </div>
      <div class="form-actions">
        <button class="btn-primary" onclick="addCard()">Add Card</button>
        <button class="btn" onclick="closeAddCard()">Cancel</button>
      </div>
    </div>

    <div id="flashcardGrid" class="flashcard-grid"></div>
  </div>

</div><!-- /#app-layout -->

<div id="toast-container"></div>

<div id="shutdownOverlay" class="hidden">
  <div class="shutdown-msg">
    <h2>Server stopped</h2>
    <p>You can close this tab.</p>
    <button class="btn" onclick="window.close()">Close</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
